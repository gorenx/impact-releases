name: 报告问题 · Bug report
description: 报告 Impact 的异常行为
title: '[Bug] '
body:
  - type: markdown
    attributes:
      value: 此 Issue 对所有人公开。请移除账号、密钥和私人内容。
  - type: input
    id: version
    attributes:
      label: Impact 版本
      description: 在「设置 → 关于与更新」查看。
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 实际结果
      description: 发生了什么？可以写下复现步骤。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
